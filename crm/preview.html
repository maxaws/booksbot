<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>One System CRM</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#2563eb;--primary-dark:#1d4ed8;--primary-light:#dbeafe;
  --success:#16a34a;--success-light:#dcfce7;
  --warning:#d97706;--warning-light:#fef3c7;
  --danger:#dc2626;--danger-light:#fee2e2;
  --sidebar:#1e293b;--bg:#f1f5f9;--surface:#fff;
  --border:#e2e8f0;--text:#0f172a;--muted:#64748b;
  --r:8px;--sh:0 1px 3px rgba(0,0,0,.1)
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;color:var(--text);background:var(--bg);line-height:1.5}

/* ── Layout ── */
#app{display:flex;min-height:100vh}
.sidebar{width:240px;flex-shrink:0;background:var(--sidebar);display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:10}
.logo{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo .brand{font-size:18px;font-weight:700;color:#fff}
.logo .sub{font-size:11px;color:#94a3b8;margin-top:2px}
nav{flex:1;padding:12px 8px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;color:#94a3b8;font-size:13.5px;font-weight:500;width:100%;border:none;background:none;cursor:pointer;margin-bottom:2px;text-align:left;transition:all .15s}
.nav-btn:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-btn.active{background:var(--primary);color:#fff}
.nav-icon{font-size:16px;width:20px;text-align:center}
.sidebar-foot{padding:12px 8px}
.main{margin-left:240px;flex:1}
.page{padding:32px}

/* ── Page header ── */
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.ptitle{font-size:22px;font-weight:700}
.psub{font-size:13px;color:var(--muted);margin-top:2px}

/* ── Card ── */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--border)}
.card-hd{padding:16px 20px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px}

/* ── Stat grid ── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--border);padding:20px;display:flex;align-items:flex-start;gap:16px}
.stat-ic{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.ic-blue{background:var(--primary-light)}.ic-green{background:var(--success-light)}.ic-amber{background:var(--warning-light)}.ic-red{background:var(--danger-light)}
.stat-lbl{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat-val{font-size:26px;font-weight:700;margin-top:4px}

/* ── Table ── */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;padding:10px 16px;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#f8fafc;border-bottom:1px solid var(--border)}
tr{border-bottom:1px solid var(--border)}
tr:last-child{border-bottom:none}
tbody tr:hover{background:#f8fafc}
td{padding:12px 16px;vertical-align:middle}

/* ── Badge ── */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600}
.b-nouveau{background:#e0f2fe;color:#0369a1}
.b-en_cours{background:var(--warning-light);color:#92400e}
.b-gagne{background:var(--success-light);color:#14532d}
.b-perdu{background:#f1f5f9;color:#475569}
.b-attente{background:var(--warning-light);color:#92400e}
.b-paye{background:var(--success-light);color:#14532d}
.b-actif{background:var(--success-light);color:#14532d}
.b-inactif{background:#f1f5f9;color:#475569}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;font-size:13.5px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .15s;font-family:inherit}
.btn-p{background:var(--primary);color:#fff;border-color:var(--primary)}.btn-p:hover{background:var(--primary-dark)}
.btn-s{background:var(--surface);color:var(--text);border-color:var(--border)}.btn-s:hover{background:#f8fafc}
.btn-ok{background:var(--success);color:#fff}.btn-ok:hover{background:#15803d}
.btn-d{background:var(--danger);color:#fff}.btn-d:hover{background:#b91c1c}
.btn-g{background:transparent;color:var(--muted);border-color:transparent}.btn-g:hover{background:#f1f5f9}
.sm{padding:5px 10px;font-size:12.5px}

/* ── Search ── */
.search{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface);min-width:200px}
.search input{border:none;outline:none;font-size:13.5px;flex:1;background:transparent;color:var(--text)}

/* ── Form ── */
.fg{margin-bottom:16px}
.fl{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.fl span{color:var(--danger)}
.fc{display:block;width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13.5px;color:var(--text);background:var(--surface);outline:none;font-family:inherit;transition:border-color .15s}
.fc:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fa{display:flex;justify-content:flex-end;gap:8px;padding-top:12px;border-top:1px solid var(--border);margin-top:12px}

/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:var(--surface);border-radius:10px;box-shadow:0 4px 24px rgba(0,0,0,.15);width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.mt{font-size:16px;font-weight:600}
.mb{padding:20px}

/* ── Misc ── */
.fw{font-weight:600}.tm{color:var(--muted)}.tsm{font-size:12.5px}
.row{display:flex;align-items:center;gap:8px}
.alert{padding:12px 16px;border-radius:6px;font-size:13.5px;margin-bottom:16px;border-left:4px solid}
.a-info{background:#e0f2fe;border-color:#0369a1;color:#0c4a6e}
.a-err{background:var(--danger-light);border-color:var(--danger);color:#7f1d1d}
.hidden{display:none!important}
.demo-tag{position:fixed;top:12px;right:12px;background:#7c3aed;color:#fff;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;z-index:999;letter-spacing:.04em;pointer-events:none}

/* ── Login ── */
.login-wrap{min-height:100vh;background:var(--bg);display:flex;align-items:center;justify-content:center}
.login-box{width:100%;max-width:400px;padding:0 16px}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo .icon{font-size:44px;margin-bottom:8px}
.login-logo .name{font-size:22px;font-weight:700}
.login-logo .sub{color:var(--muted);font-size:13px;margin-top:4px}

/* ── Two-col stat row ── */
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
</style>
</head>
<body>

<div class="demo-tag">APERÇU — données fictives</div>

<!-- APP -->
<div id="app">
  <aside class="sidebar">
    <div class="logo"><div class="brand">One System</div><div class="sub">CRM Apporteurs d'affaires</div></div>
    <nav>
      <button class="nav-btn active" data-page="dashboard"  onclick="go('dashboard')"><span class="nav-icon">📊</span>Tableau de bord</button>
      <button class="nav-btn"        data-page="apporteurs" onclick="go('apporteurs')"><span class="nav-icon">👥</span>Apporteurs</button>
      <button class="nav-btn"        data-page="opportunites" onclick="go('opportunites')"><span class="nav-icon">🎯</span>Opportunités</button>
      <button class="nav-btn"        data-page="commissions" onclick="go('commissions')"><span class="nav-icon">💰</span>Commissions</button>
    </nav>
    <div class="sidebar-foot"></div>
    <div style="padding:8px 20px 16px;font-size:11px;color:#475569">v1.0.0 — One System © 2025</div>
  </aside>
  <main class="main">
    <div id="page-dashboard" class="page"></div>
    <div id="page-apporteurs" class="page hidden"></div>
    <div id="page-opportunites" class="page hidden"></div>
    <div id="page-commissions" class="page hidden"></div>
  </main>
</div>

<!-- MODAL -->
<div id="modal-overlay" class="overlay hidden" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="mh"><span class="mt" id="modal-title"></span><button class="btn btn-g sm" onclick="closeModal()">✕</button></div>
    <div class="mb" id="modal-body"></div>
  </div>
</div>

<script>
// ── Data ─────────────────────────────────────────────────────────────────────
const APPORTEURS = [
  {id:1,prenom:"Sophie",nom:"Martin",email:"s.martin@nexusco.fr",tel:"06 12 34 56 78",societe:"NexusCo",taux:12,actif:true,date:"15/01/2024",nbopp:4,ca:87000},
  {id:2,prenom:"Thomas",nom:"Durand",email:"t.durand@td-conseil.fr",tel:"07 23 45 67 89",societe:"TD Conseil",taux:10,actif:true,date:"20/02/2024",nbopp:6,ca:142500},
  {id:3,prenom:"Marie",nom:"Leblanc",email:"m.leblanc@mlpartners.com",tel:"06 87 65 43 21",societe:"ML Partners",taux:8,actif:true,date:"10/03/2024",nbopp:3,ca:35000},
  {id:4,prenom:"Nicolas",nom:"Bernard",email:"n.bernard@freelance.fr",tel:"",societe:"",taux:15,actif:false,date:"05/11/2023",nbopp:2,ca:18000},
  {id:5,prenom:"Camille",nom:"Petit",email:"c.petit@cbiz.fr",tel:"06 55 44 33 22",societe:"C-Biz",taux:11,actif:true,date:"01/04/2024",nbopp:2,ca:63000},
];
const OPPORTUNITES = [
  {id:1,apporteur:"Thomas Durand",prospect:"Lemaire SA",societe:"Lemaire SA",montant:45000,statut:"gagne",creation:"12/09/2024",cloture:"03/11/2024"},
  {id:2,apporteur:"Sophie Martin",prospect:"Fabrice Chauvin",societe:"Chauvin & Fils",montant:22000,statut:"en_cours",creation:"01/10/2024",cloture:"—"},
  {id:3,apporteur:"Camille Petit",prospect:"Groupe Horizon",societe:"Groupe Horizon SAS",montant:63000,statut:"gagne",creation:"20/08/2024",cloture:"15/10/2024"},
  {id:4,apporteur:"Thomas Durand",prospect:"Optim'Pro",societe:"Optim'Pro",montant:38000,statut:"en_cours",creation:"05/11/2024",cloture:"—"},
  {id:5,apporteur:"Sophie Martin",prospect:"Renault Distribution Est",societe:"RDE",montant:87000,statut:"gagne",creation:"15/07/2024",cloture:"30/09/2024"},
  {id:6,apporteur:"Marie Leblanc",prospect:"Startup Innov",societe:"",montant:12000,statut:"perdu",creation:"20/10/2024",cloture:"10/11/2024"},
  {id:7,apporteur:"Thomas Durand",prospect:"Logis & Co",societe:"Logis & Co",montant:59500,statut:"gagne",creation:"01/06/2024",cloture:"12/08/2024"},
  {id:8,apporteur:"Nicolas Bernard",prospect:"Axel Moreau",societe:"AM Conseil",montant:18000,statut:"nouveau",creation:"15/11/2024",cloture:"—"},
];
let COMMISSIONS = [
  {id:1,apporteur:"Thomas Durand",prospect:"Lemaire SA",societe:"Lemaire SA",affaire:45000,montant:4500,statut:"paye",calcule:"03/11/2024",paye:"30/11/2024"},
  {id:2,apporteur:"Camille Petit",prospect:"Groupe Horizon",societe:"Groupe Horizon SAS",affaire:63000,montant:6930,statut:"attente",calcule:"15/10/2024",paye:"—"},
  {id:3,apporteur:"Sophie Martin",prospect:"Renault Distribution Est",societe:"RDE",affaire:87000,montant:10440,statut:"attente",calcule:"30/09/2024",paye:"—"},
  {id:4,apporteur:"Thomas Durand",prospect:"Logis & Co",societe:"Logis & Co",affaire:59500,montant:5950,statut:"paye",calcule:"12/08/2024",paye:"01/09/2024"},
];

// ── Helpers ───────────────────────────────────────────────────────────────────
const € = n => new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n);
const SLABELS = {nouveau:"Nouveau",en_cours:"En cours",gagne:"Gagné",perdu:"Perdu"};
const SCLS    = {nouveau:"b-nouveau",en_cours:"b-en_cours",gagne:"b-gagne",perdu:"b-perdu"};
const badge = (s,lbl,cls) => `<span class="badge ${cls}">${lbl}</span>`;

// Init
renderDashboard(); renderApporteurs(); renderOpportunites(); renderCommissions();

// ── Navigation ────────────────────────────────────────────────────────────────
let curPage="dashboard";
function go(page){
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
  document.querySelectorAll(".page").forEach(p=>p.classList.add("hidden"));
  document.getElementById("page-"+page).classList.remove("hidden");
  curPage=page;
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function openModal(title,html){
  document.getElementById("modal-title").textContent=title;
  document.getElementById("modal-body").innerHTML=html;
  document.getElementById("modal-overlay").classList.remove("hidden");
}
function closeModal(){ document.getElementById("modal-overlay").classList.add("hidden"); }

// ── Dashboard ─────────────────────────────────────────────────────────────────
function renderDashboard(){
  const top = [...APPORTEURS].filter(a=>a.ca>0).sort((a,b)=>b.ca-a.ca).slice(0,5);
  const medals = ["🥇","🥈","🥉"];
  document.getElementById("page-dashboard").innerHTML = `
    <div class="ph">
      <div><div class="ptitle">Tableau de bord</div><div class="psub">Vue d'ensemble de l'activité des apporteurs</div></div>
    </div>
    <div class="stat-grid">
      <div class="stat"><div class="stat-ic ic-blue">👥</div><div><div class="stat-lbl">Apporteurs actifs</div><div class="stat-val">4</div></div></div>
      <div class="stat"><div class="stat-ic ic-amber">🎯</div><div><div class="stat-lbl">Opportunités en cours</div><div class="stat-val">3</div></div></div>
      <div class="stat"><div class="stat-ic ic-green">📈</div><div><div class="stat-lbl">CA gagné</div><div class="stat-val">${€(254500)}</div></div></div>
      <div class="stat"><div class="stat-ic ic-red">💰</div><div><div class="stat-lbl">Commissions dues</div><div class="stat-val">${€(17370)}</div></div></div>
    </div>
    <div class="card">
      <div class="card-hd">🏆 Top 5 apporteurs (CA gagné)</div>
      <div class="tw"><table>
        <thead><tr><th>#</th><th>Apporteur</th><th>CA généré</th><th>Opportunités</th></tr></thead>
        <tbody>${top.map((a,i)=>`<tr>
          <td style="font-weight:700;color:${i===0?'#f59e0b':'inherit'}">${medals[i]||i+1+'.'}</td>
          <td class="fw">${a.prenom} ${a.nom}</td>
          <td class="fw" style="color:var(--success)">${€(a.ca)}</td>
          <td>${a.nbopp}</td>
        </tr>`).join("")}</tbody>
      </table></div>
    </div>`;
}

// ── Apporteurs ────────────────────────────────────────────────────────────────
let appSearch="";
function renderApporteurs(){
  const q=appSearch.toLowerCase();
  const list=APPORTEURS.filter(a=>`${a.prenom} ${a.nom} ${a.email} ${a.societe}`.toLowerCase().includes(q));
  document.getElementById("page-apporteurs").innerHTML=`
    <div class="ph">
      <div><div class="ptitle">Apporteurs d'affaires</div><div class="psub">${APPORTEURS.length} apporteurs enregistrés</div></div>
      <div class="row">
        <div class="search"><span>🔍</span><input id="app-search" placeholder="Rechercher…" value="${appSearch}" oninput="appSearch=this.value;renderApporteurs()" /></div>
        <button class="btn btn-p" onclick="openApporteurModal(null)">+ Nouvel apporteur</button>
      </div>
    </div>
    <div class="card"><div class="tw"><table>
      <thead><tr><th>Nom</th><th>Société</th><th>Contact</th><th>Commission</th><th>CA généré</th><th>Opp.</th><th>Statut</th><th></th></tr></thead>
      <tbody>${list.map(a=>`<tr>
        <td><div class="fw">${a.prenom} ${a.nom}</div></td>
        <td class="tm">${a.societe||"—"}</td>
        <td><div>${a.email}</div>${a.tel?`<div class="tm tsm">${a.tel}</div>`:""}</td>
        <td class="fw">${a.taux}%</td>
        <td class="fw" style="color:var(--success)">${€(a.ca)}</td>
        <td>${a.nbopp}</td>
        <td><span class="badge ${a.actif?"b-actif":"b-inactif"}">${a.actif?"Actif":"Inactif"}</span></td>
        <td><div class="row"><button class="btn btn-s sm" onclick="openApporteurModal(${a.id})">Modifier</button><button class="btn btn-d sm">Suppr.</button></div></td>
      </tr>`).join("")}</tbody>
    </table></div></div>`;
}

function openApporteurModal(id){
  const a = id ? APPORTEURS.find(x=>x.id===id) : null;
  const title = a ? "Modifier l'apporteur" : "Nouvel apporteur";
  openModal(title,`
    <div class="fg2">
      <div class="fg"><label class="fl">Prénom <span>*</span></label><input class="fc" id="m-prenom" value="${a?.prenom||""}"/></div>
      <div class="fg"><label class="fl">Nom <span>*</span></label><input class="fc" id="m-nom" value="${a?.nom||""}"/></div>
    </div>
    <div class="fg"><label class="fl">Email <span>*</span></label><input class="fc" type="email" id="m-email" value="${a?.email||""}"/></div>
    <div class="fg2">
      <div class="fg"><label class="fl">Téléphone</label><input class="fc" id="m-tel" value="${a?.tel||""}"/></div>
      <div class="fg"><label class="fl">Société</label><input class="fc" id="m-soc" value="${a?.societe||""}"/></div>
    </div>
    <div class="fg"><label class="fl">Taux de commission (%) <span>*</span></label><input class="fc" type="number" min="0" max="100" step="0.5" id="m-taux" value="${a?.taux||10}"/></div>
    ${a?`<div class="fg"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="m-actif" ${a.actif?"checked":""}/> Apporteur actif</label></div>`:""}
    <div class="fa">
      <button class="btn btn-s" onclick="closeModal()">Annuler</button>
      <button class="btn btn-p" onclick="closeModal();renderApporteurs()">Enregistrer</button>
    </div>`);
}

// ── Opportunités ──────────────────────────────────────────────────────────────
let oppSearch="",oppFilter="";
function renderOpportunites(){
  const q=oppSearch.toLowerCase();
  const list=OPPORTUNITES.filter(o=>
    `${o.prospect} ${o.societe} ${o.apporteur}`.toLowerCase().includes(q)&&
    (!oppFilter||o.statut===oppFilter)
  );
  document.getElementById("page-opportunites").innerHTML=`
    <div class="ph">
      <div><div class="ptitle">Opportunités</div><div class="psub">${OPPORTUNITES.length} opportunités</div></div>
      <div class="row">
        <div class="search"><span>🔍</span><input placeholder="Rechercher…" value="${oppSearch}" oninput="oppSearch=this.value;renderOpportunites()"/></div>
        <select class="fc" style="width:auto" onchange="oppFilter=this.value;renderOpportunites()">
          <option value="" ${!oppFilter?"selected":""}>Tous les statuts</option>
          <option value="nouveau" ${oppFilter==="nouveau"?"selected":""}>Nouveau</option>
          <option value="en_cours" ${oppFilter==="en_cours"?"selected":""}>En cours</option>
          <option value="gagne" ${oppFilter==="gagne"?"selected":""}>Gagné</option>
          <option value="perdu" ${oppFilter==="perdu"?"selected":""}>Perdu</option>
        </select>
        <button class="btn btn-p" onclick="openOppModal(null)">+ Nouvelle opportunité</button>
      </div>
    </div>
    <div class="card"><div class="tw"><table>
      <thead><tr><th>Prospect</th><th>Apporteur</th><th>Montant estimé</th><th>Statut</th><th>Création</th><th>Clôture</th><th></th></tr></thead>
      <tbody>${list.map(o=>`<tr>
        <td><div class="fw">${o.prospect}</div>${o.societe?`<div class="tm tsm">${o.societe}</div>`:""}</td>
        <td>${o.apporteur}</td>
        <td class="fw">${€(o.montant)}</td>
        <td><span class="badge ${SCLS[o.statut]}">${SLABELS[o.statut]}</span></td>
        <td class="tm">${o.creation}</td>
        <td class="tm">${o.cloture}</td>
        <td><div class="row"><button class="btn btn-s sm" onclick="openOppModal(${o.id})">Modifier</button><button class="btn btn-d sm">Suppr.</button></div></td>
      </tr>`).join("")}</tbody>
    </table></div></div>`;
}

function openOppModal(id){
  const o = id ? OPPORTUNITES.find(x=>x.id===id) : null;
  openModal(o?"Modifier l'opportunité":"Nouvelle opportunité",`
    <div class="fg"><label class="fl">Apporteur <span>*</span></label>
      <select class="fc">${APPORTEURS.map(a=>`<option ${o&&o.apporteur===a.prenom+" "+a.nom?"selected":""}>${a.prenom} ${a.nom}</option>`).join("")}</select>
    </div>
    <div class="fg2">
      <div class="fg"><label class="fl">Nom du prospect <span>*</span></label><input class="fc" value="${o?.prospect||""}"/></div>
      <div class="fg"><label class="fl">Société</label><input class="fc" value="${o?.societe||""}"/></div>
    </div>
    <div class="fg2">
      <div class="fg"><label class="fl">Montant estimé (€)</label><input class="fc" type="number" min="0" value="${o?.montant||0}"/></div>
      <div class="fg"><label class="fl">Statut</label>
        <select class="fc">
          <option value="nouveau" ${o?.statut==="nouveau"?"selected":""}>Nouveau</option>
          <option value="en_cours" ${o?.statut==="en_cours"?"selected":""}>En cours</option>
          <option value="gagne" ${o?.statut==="gagne"?"selected":""}>Gagné</option>
          <option value="perdu" ${o?.statut==="perdu"?"selected":""}>Perdu</option>
        </select>
      </div>
    </div>
    <div class="fg"><label class="fl">Description / Notes</label><textarea class="fc" style="min-height:70px"></textarea></div>
    <div class="alert a-info" style="margin-bottom:0">✅ Une commission est calculée automatiquement quand le statut passe à <strong>Gagné</strong>.</div>
    <div class="fa"><button class="btn btn-s" onclick="closeModal()">Annuler</button><button class="btn btn-p" onclick="closeModal()">Enregistrer</button></div>`);
}

// ── Commissions ───────────────────────────────────────────────────────────────
let comFilter="";
function renderCommissions(){
  const list = comFilter ? COMMISSIONS.filter(c=>c.statut===comFilter) : COMMISSIONS;
  const dues = COMMISSIONS.filter(c=>c.statut==="attente").reduce((s,c)=>s+c.montant,0);
  const paye = COMMISSIONS.filter(c=>c.statut==="paye").reduce((s,c)=>s+c.montant,0);
  document.getElementById("page-commissions").innerHTML=`
    <div class="ph">
      <div><div class="ptitle">Commissions</div><div class="psub">Suivi des commissions dues aux apporteurs</div></div>
      <div class="row">
        <select class="fc" style="width:auto" onchange="comFilter=this.value;renderCommissions()">
          <option value="" ${!comFilter?"selected":""}>Toutes</option>
          <option value="attente" ${comFilter==="attente"?"selected":""}>En attente</option>
          <option value="paye" ${comFilter==="paye"?"selected":""}>Payées</option>
        </select>
      </div>
    </div>
    <div class="stat2">
      <div class="stat"><div class="stat-ic ic-amber">💳</div><div><div class="stat-lbl">Commissions dues</div><div class="stat-val" style="color:var(--warning)">${€(dues)}</div></div></div>
      <div class="stat"><div class="stat-ic ic-green">✅</div><div><div class="stat-lbl">Commissions payées</div><div class="stat-val" style="color:var(--success)">${€(paye)}</div></div></div>
    </div>
    <div class="card"><div class="tw"><table>
      <thead><tr><th>Apporteur</th><th>Prospect</th><th>Montant affaire</th><th>Commission</th><th>Statut</th><th>Calculée le</th><th>Payée le</th><th></th></tr></thead>
      <tbody>${list.map(c=>`<tr>
        <td class="fw">${c.apporteur}</td>
        <td><div>${c.prospect}</div>${c.societe?`<div class="tm tsm">${c.societe}</div>`:""}</td>
        <td>${€(c.affaire)}</td>
        <td class="fw" style="color:var(--primary)">${€(c.montant)}</td>
        <td><span class="badge ${c.statut==="paye"?"b-paye":"b-attente"}">${c.statut==="paye"?"Payée":"En attente"}</span></td>
        <td class="tm">${c.calcule}</td>
        <td class="tm">${c.paye}</td>
        <td>${c.statut==="attente"?`<button class="btn btn-ok sm" onclick="payerCommission(${c.id})">Marquer payée</button>`:""}</td>
      </tr>`).join("")}</tbody>
    </table></div></div>`;
}

function payerCommission(id){
  const c = COMMISSIONS.find(x=>x.id===id);
  if(c){ c.statut="paye"; c.paye=new Date().toLocaleDateString("fr-FR"); }
  renderCommissions();
  renderDashboard();
}
</script>
</body>
