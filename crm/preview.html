<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>One System CRM — Aperçu</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#2563eb;--primary-dark:#1d4ed8;--primary-light:#dbeafe;
  --success:#16a34a;--success-light:#dcfce7;
  --warning:#d97706;--warning-light:#fef3c7;
  --danger:#dc2626;--danger-light:#fee2e2;
  --sidebar-bg:#1e293b;--bg:#f1f5f9;--surface:#ffffff;
  --border:#e2e8f0;--text:#0f172a;--text-muted:#64748b;
  --radius:8px;--shadow:0 1px 3px rgba(0,0,0,.1);--shadow-md:0 4px 6px -1px rgba(0,0,0,.1)
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;color:var(--text);background:var(--bg);line-height:1.5}
.layout{display:flex;min-height:100vh}
.sidebar{width:240px;flex-shrink:0;background:var(--sidebar-bg);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100}
.sidebar-logo{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-logo .brand{font-size:18px;font-weight:700;color:#fff}
.sidebar-logo .sub{font-size:11px;color:#94a3b8;margin-top:2px}
.sidebar-nav{flex:1;padding:12px 8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;color:#94a3b8;text-decoration:none;font-size:13.5px;font-weight:500;transition:all .15s;margin-bottom:2px;cursor:pointer;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:var(--primary);color:#fff}
.nav-icon{font-size:16px;width:20px;text-align:center}
.main-content{margin-left:240px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.page{padding:32px;flex:1}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.page-title{font-size:22px;font-weight:700}
.page-subtitle{font-size:13px;color:var(--text-muted);margin-top:2px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border)}
.card-body{padding:20px}
.card-header{padding:16px 20px;border-bottom:1px solid var(--border);font-weight:600}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);padding:20px;display:flex;align-items:flex-start;gap:16px}
.stat-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.stat-icon.blue{background:var(--primary-light)}.stat-icon.green{background:var(--success-light)}.stat-icon.amber{background:var(--warning-light)}.stat-icon.red{background:var(--danger-light)}
.stat-label{font-size:12px;color:var(--text-muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.stat-value{font-size:26px;font-weight:700;margin-top:4px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{text-align:left;padding:10px 16px;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);background:#f8fafc;border-bottom:1px solid var(--border)}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#f8fafc}
td{padding:12px 16px;vertical-align:middle}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600}
.badge-nouveau{background:#e0f2fe;color:#0369a1}.badge-en_cours{background:var(--warning-light);color:#92400e}.badge-gagne{background:var(--success-light);color:#14532d}.badge-perdu{background:#f1f5f9;color:#475569}
.badge-en_attente{background:var(--warning-light);color:#92400e}.badge-paye{background:var(--success-light);color:#14532d}
.badge-actif{background:var(--success-light);color:#14532d}.badge-inactif{background:#f1f5f9;color:#475569}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;font-size:13.5px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .15s}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border)}.btn-secondary:hover{background:#f8fafc}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{background:#15803d}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:5px 10px;font-size:12.5px}
.btn-ghost{background:transparent;color:var(--text-muted);border-color:transparent}.btn-ghost:hover{background:#f1f5f9;color:var(--text)}
.search-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface);min-width:220px}
.search-bar input{border:none;outline:none;font-size:13.5px;flex:1;background:transparent;color:var(--text)}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.form-label span{color:var(--danger)}
.form-control{display:block;width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13.5px;color:var(--text);background:var(--surface);transition:border-color .15s;outline:none}
.form-control:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:8px;border-top:1px solid var(--border);margin-top:8px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:var(--surface);border-radius:10px;box-shadow:var(--shadow-md);width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-title{font-size:16px;font-weight:600}
.modal-body{padding:20px}
.fw-600{font-weight:600}.text-muted{color:var(--text-muted)}.text-sm{font-size:12.5px}
.flex{display:flex}.items-center{align-items:center}.gap-2{gap:8px}
.login-wrap{min-height:100vh;background:var(--bg);display:flex;align-items:center;justify-content:center}
.alert{padding:12px 16px;border-radius:6px;font-size:13.5px;margin-bottom:16px;border-left:4px solid}
.alert-info{background:#e0f2fe;border-color:#0369a1;color:#0c4a6e}
.tag-demo{position:fixed;top:12px;right:12px;background:#7c3aed;color:#fff;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;z-index:9999;letter-spacing:.04em}
select.form-control{cursor:pointer}
</style>
</head>
<body>
<div id="root"></div>
<div class="tag-demo">APERÇU — données fictives</div>
<script type="text/babel">

  {id:2,apporteur_id:1,apporteur_nom:"Martin",apporteur_prenom:"Sophie",nom_prospect:"Fabrice Chauvin",societe_prospect:"Chauvin & Fils",montant_estime:22000,statut:"en_cours",date_creation:"2024-10-01",date_cloture:null},

  {id:5,apporteur_id:1,apporteur_nom:"Martin",apporteur_prenom:"Sophie",nom_prospect:"Renault Distribution Est",societe_prospect:"RDE",montant_estime:87000,statut:"gagne",date_creation:"2024-07-15",date_cloture:"2024-09-30"},
  {id:6,apporteur_id:3,apporteur_nom:"Leblanc",apporteur_prenom:"Marie",nom_prospect:"Startup Innov",societe_prospect:"",montant_estime:12000,statut:"perdu",date_creation:"2024-10-20",date_cloture:"2024-11-10"},
  {id:7,apporteur_id:2,apporteur_nom:"Durand",apporteur_prenom:"Thomas",nom_prospect:"Logis & Co",societe_prospect:"Logis & Co",montant_estime:59500,statut:"gagne",date_creation:"2024-06-01",date_cloture:"2024-08-12"},

];
const COMMISSIONS = [
  {id:1,opportunite_id:1,apporteur_id:2,apporteur_nom:"Durand",apporteur_prenom:"Thomas",prospect_nom:"Lemaire SA",prospect_societe:"Lemaire SA",montant:4500,montant_affaire:45000,statut_paiement:"paye",date_calcul:"2024-11-03",date_paiement:"2024-11-30"},
  {id:2,opportunite_id:3,apporteur_id:5,apporteur_nom:"Petit",apporteur_prenom:"Camille",prospect_nom:"Groupe Horizon",prospect_societe:"Groupe Horizon SAS",montant:6930,montant_affaire:63000,statut_paiement:"en_attente",date_calcul:"2024-10-15",date_paiement:null},
  {id:3,opportunite_id:5,apporteur_id:1,apporteur_nom:"Martin",apporteur_prenom:"Sophie",prospect_nom:"Renault Distribution Est",prospect_societe:"RDE",montant:10440,montant_affaire:87000,statut_paiement:"en_attente",date_calcul:"2024-09-30",date_paiement:null},
  {id:4,opportunite_id:7,apporteur_id:2,apporteur_nom:"Durand",apporteur_prenom:"Thomas",prospect_nom:"Logis & Co",prospect_societe:"Logis & Co",montant:5950,montant_affaire:59500,statut_paiement:"paye",date_calcul:"2024-08-12",date_paiement:"2024-09-01"},
];

// ── Helpers ───────────────────────────────────────────────────────────────────
const fmt = n => new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n);
const fmtDate = d => d ? new Date(d).toLocaleDateString("fr-FR") : "—";

const STATUT_LABELS = {nouveau:"Nouveau",en_cours:"En cours",gagne:"Gagné",perdu:"Perdu"};

function Badge({statut}){
  return <span className={`badge badge-${statut}`}>{STATUT_LABELS[statut]||statut}</span>;
}

// ── Login ─────────────────────────────────────────────────────────────────────
function Login({onLogin}){
  const [u,setU]=useState("");const[p,setP]=useState("");const[err,setErr]=useState(null);
  const submit=e=>{
    e.preventDefault();
    if(u==="admin"&&p==="demo"){onLogin();}
    else setErr("Identifiants incorrects — essayez admin / demo");
  };
  return(
    <div className="login-wrap">
      <div style={{width:"100%",maxWidth:400,padding:"0 16px"}}>
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{fontSize:40,marginBottom:8}}>💼</div>
          <div style={{fontSize:22,fontWeight:700}}>One System CRM</div>
          <div style={{color:"var(--text-muted)",marginTop:4,fontSize:13}}>Connectez-vous pour accéder au CRM</div>
        </div>
        <div className="card"><div className="card-body">
          <div className="alert alert-info">🔑 Identifiants démo : <strong>admin</strong> / <strong>demo</strong></div>
          {err&&<div className="alert" style={{background:"var(--danger-light)",borderColor:"var(--danger)",color:"#7f1d1d"}}>{err}</div>}
          <form onSubmit={submit}>
            <div className="form-group"><label className="form-label">Identifiant</label><input className="form-control" value={u} onChange={e=>setU(e.target.value)} autoFocus/></div>
            <div className="form-group"><label className="form-label">Mot de passe</label><input className="form-control" type="password" value={p} onChange={e=>setP(e.target.value)}/></div>
            <button type="submit" className="btn btn-primary" style={{width:"100%",justifyContent:"center",marginTop:8}}>Se connecter</button>
          </form>
        </div></div>
      </div>
    </div>
  );
}

// ── Sidebar ───────────────────────────────────────────────────────────────────
const NAV=[{page:"dashboard",icon:"📊",label:"Tableau de bord"},{page:"apporteurs",icon:"👥",label:"Apporteurs"},{page:"opportunites",icon:"🎯",label:"Opportunités"},{page:"commissions",icon:"💰",label:"Commissions"}];

function Sidebar({page,setPage,onLogout}){
  return(
    <aside className="sidebar">
      <div className="sidebar-logo"><div className="brand">One System</div><div className="sub">CRM Apporteurs d'affaires</div></div>
      <nav className="sidebar-nav">
        {NAV.map(({page:p,icon,label})=>(
          <button key={p} className={`nav-item${page===p?" active":""}`} onClick={()=>setPage(p)}>
            <span className="nav-icon">{icon}</span>{label}
          </button>
        ))}
      </nav>
      <div style={{padding:"12px 8px"}}>
        <button className="nav-item" onClick={onLogout}><span className="nav-icon">🚪</span>Déconnexion</button>
      </div>
      <div style={{padding:"8px 20px 16px",fontSize:"11px",color:"#475569"}}>v1.0.0 — One System © 2025</div>
    </aside>
  );
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
function Dashboard(){
  const top=[
    {id:2,prenom:"Thomas",nom:"Durand",ca_total:142500,nb_affaires:3},
    {id:1,prenom:"Sophie",nom:"Martin",ca_total:87000,nb_affaires:2},

      </div>
      <div className="stat-grid">
        <div className="stat-card"><div className="stat-icon blue">👥</div><div><div className="stat-label">Apporteurs actifs</div><div className="stat-value">4</div></div></div>
        <div className="stat-card"><div className="stat-icon amber">🎯</div><div><div className="stat-label">Opportunités en cours</div><div className="stat-value">3</div></div></div>
        <div className="stat-card"><div className="stat-icon green">📈</div><div><div className="stat-label">CA gagné</div><div className="stat-value">{fmt(254500)}</div></div></div>

      <div className="card">
        <div className="card-header">🏆 Top 5 apporteurs (CA gagné)</div>
        <div className="table-wrap">
          <table><thead><tr><th>#</th><th>Apporteur</th><th>Affaires gagnées</th><th>CA total</th></tr></thead>

// ── Apporteurs ────────────────────────────────────────────────────────────────
function ApporteurModal({apporteur,onClose}){
  const isEdit=Boolean(apporteur?.id);
  const[form,setForm]=useState(isEdit?{...apporteur}:{nom:"",prenom:"",email:"",telephone:"",societe:"",taux_commission:10,actif:true});
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  return(
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-header"><div className="modal-title">{isEdit?"Modifier l'apporteur":"Nouvel apporteur"}</div><button className="btn btn-ghost btn-sm" onClick={onClose}>✕</button></div>
        <div className="modal-body">
          <div className="form-grid">
            <div className="form-group"><label className="form-label">Prénom <span>*</span></label><input className="form-control" value={form.prenom} onChange={e=>set("prenom",e.target.value)}/></div>
            <div className="form-group"><label className="form-label">Nom <span>*</span></label><input className="form-control" value={form.nom} onChange={e=>set("nom",e.target.value)}/></div>
          </div>
          <div className="form-group"><label className="form-label">Email <span>*</span></label><input className="form-control" type="email" value={form.email} onChange={e=>set("email",e.target.value)}/></div>
          <div className="form-grid">
            <div className="form-group"><label className="form-label">Téléphone</label><input className="form-control" value={form.telephone||""} onChange={e=>set("telephone",e.target.value)}/></div>
            <div className="form-group"><label className="form-label">Société</label><input className="form-control" value={form.societe||""} onChange={e=>set("societe",e.target.value)}/></div>
          </div>
          <div className="form-group"><label className="form-label">Taux de commission (%) <span>*</span></label><input className="form-control" type="number" min="0" max="100" step="0.5" value={form.taux_commission} onChange={e=>set("taux_commission",parseFloat(e.target.value))}/></div>
          {isEdit&&<div className="form-group"><label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer"}}><input type="checkbox" checked={form.actif} onChange={e=>set("actif",e.target.checked)}/> Apporteur actif</label></div>}
          <div className="form-actions"><button className="btn btn-secondary" onClick={onClose}>Annuler</button><button className="btn btn-primary" onClick={onClose}>Enregistrer</button></div>
        </div>
      </div>
    </div>
  );
}

function Apporteurs(){
  const[search,setSearch]=useState("");
  const[modal,setModal]=useState(null);
  const filtered=APPORTEURS.filter(a=>`${a.prenom} ${a.nom} ${a.email} ${a.societe||""}`.toLowerCase().includes(search.toLowerCase()));
  return(
    <>
      {modal!==null&&<ApporteurModal apporteur={modal==="new"?null:modal} onClose={()=>setModal(null)}/>}
      <div className="page-header">
        <div><div className="page-title">Apporteurs d'affaires</div><div className="page-subtitle">{APPORTEURS.length} apporteurs enregistrés</div></div>
        <div className="flex items-center gap-2">
          <div className="search-bar"><span>🔍</span><input placeholder="Rechercher…" value={search} onChange={e=>setSearch(e.target.value)}/></div>
          <button className="btn btn-primary" onClick={()=>setModal("new")}>+ Nouvel apporteur</button>
        </div>
      </div>
      <div className="card"><div className="table-wrap">
        <table><thead><tr><th>Nom</th><th>Société</th><th>Contact</th><th>Commission</th><th>CA généré</th><th>Opportunités</th><th>Statut</th><th></th></tr></thead>
        <tbody>
          {filtered.map(a=>(
            <tr key={a.id}>
              <td><div className="fw-600">{a.prenom} {a.nom}</div></td>
              <td className="text-muted">{a.societe||"—"}</td>
              <td><div>{a.email}</div>{a.telephone&&<div className="text-muted text-sm">{a.telephone}</div>}</td>
              <td className="fw-600">{a.taux_commission}%</td>
              <td className="fw-600" style={{color:"var(--success)"}}>{fmt(a.ca_total)}</td>
              <td>{a.nombre_opportunites}</td>
              <td><span className={`badge badge-${a.actif?"gagne":"perdu"}`}>{a.actif?"Actif":"Inactif"}</span></td>
              <td><div className="flex gap-2"><button className="btn btn-secondary btn-sm" onClick={()=>setModal(a)}>Modifier</button><button className="btn btn-danger btn-sm">Suppr.</button></div></td>
            </tr>
          ))}
        </tbody></table>
      </div></div>
    </>
  );
}

// ── Opportunités ──────────────────────────────────────────────────────────────
function OppModal({opp,onClose}){
  const isEdit=Boolean(opp?.id);
  const[form,setForm]=useState(isEdit?{...opp}:{apporteur_id:1,nom_prospect:"",societe_prospect:"",montant_estime:0,statut:"nouveau",description:""});
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  return(
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-header"><div className="modal-title">{isEdit?"Modifier l'opportunité":"Nouvelle opportunité"}</div><button className="btn btn-ghost btn-sm" onClick={onClose}>✕</button></div>
        <div className="modal-body">
          <div className="form-group"><label className="form-label">Apporteur <span>*</span></label>
            <select className="form-control" value={form.apporteur_id} onChange={e=>set("apporteur_id",Number(e.target.value))}>
              {APPORTEURS.map(a=><option key={a.id} value={a.id}>{a.prenom} {a.nom}</option>)}
            </select>
          </div>
          <div className="form-grid">
            <div className="form-group"><label className="form-label">Nom du prospect <span>*</span></label><input className="form-control" value={form.nom_prospect} onChange={e=>set("nom_prospect",e.target.value)}/></div>
            <div className="form-group"><label className="form-label">Société</label><input className="form-control" value={form.societe_prospect||""} onChange={e=>set("societe_prospect",e.target.value)}/></div>
          </div>
          <div className="form-grid">
            <div className="form-group"><label className="form-label">Montant estimé (€)</label><input className="form-control" type="number" min="0" value={form.montant_estime} onChange={e=>set("montant_estime",Number(e.target.value))}/></div>
            <div className="form-group"><label className="form-label">Statut</label>
              <select className="form-control" value={form.statut} onChange={e=>set("statut",e.target.value)}>
                <option value="nouveau">Nouveau</option><option value="en_cours">En cours</option><option value="gagne">Gagné</option><option value="perdu">Perdu</option>
              </select>
            </div>
          </div>
          <div className="form-group"><label className="form-label">Description</label><textarea className="form-control" value={form.description||""} onChange={e=>set("description",e.target.value)} style={{minHeight:70}}/></div>
          {form.statut==="gagne"&&<div className="alert alert-info" style={{marginBottom:0}}>✅ Une commission sera calculée automatiquement à la sauvegarde.</div>}
          <div className="form-actions"><button className="btn btn-secondary" onClick={onClose}>Annuler</button><button className="btn btn-primary" onClick={onClose}>Enregistrer</button></div>
        </div>
      </div>
    </div>
  );
}

function Opportunites(){
  const[search,setSearch]=useState("");
  const[filterStatut,setFilterStatut]=useState("");
  const[modal,setModal]=useState(null);
  const filtered=OPPORTUNITES.filter(o=>{
    const q=search.toLowerCase();
    return `${o.nom_prospect} ${o.societe_prospect||""} ${o.apporteur_nom} ${o.apporteur_prenom}`.toLowerCase().includes(q)&&(!filterStatut||o.statut===filterStatut);
  });
  return(
    <>
      {modal!==null&&<OppModal opp={modal==="new"?null:modal} onClose={()=>setModal(null)}/>}
      <div className="page-header">
        <div><div className="page-title">Opportunités</div><div className="page-subtitle">{OPPORTUNITES.length} opportunités</div></div>
        <div className="flex items-center gap-2">
          <div className="search-bar"><span>🔍</span><input placeholder="Rechercher…" value={search} onChange={e=>setSearch(e.target.value)}/></div>
          <select className="form-control" style={{width:"auto"}} value={filterStatut} onChange={e=>setFilterStatut(e.target.value)}>
            <option value="">Tous les statuts</option><option value="nouveau">Nouveau</option><option value="en_cours">En cours</option><option value="gagne">Gagné</option><option value="perdu">Perdu</option>
          </select>
          <button className="btn btn-primary" onClick={()=>setModal("new")}>+ Nouvelle opportunité</button>
        </div>
      </div>
      <div className="card"><div className="table-wrap">
        <table><thead><tr><th>Prospect</th><th>Apporteur</th><th>Montant estimé</th><th>Statut</th><th>Création</th><th>Clôture</th><th></th></tr></thead>
        <tbody>
          {filtered.map(o=>(
            <tr key={o.id}>
              <td><div className="fw-600">{o.nom_prospect}</div>{o.societe_prospect&&<div className="text-muted text-sm">{o.societe_prospect}</div>}</td>
              <td>{o.apporteur_prenom} {o.apporteur_nom}</td>
              <td className="fw-600">{fmt(o.montant_estime)}</td>
              <td><Badge statut={o.statut}/></td>
              <td className="text-muted">{fmtDate(o.date_creation)}</td>
              <td className="text-muted">{fmtDate(o.date_cloture)}</td>
              <td><div className="flex gap-2"><button className="btn btn-secondary btn-sm" onClick={()=>setModal(o)}>Modifier</button><button className="btn btn-danger btn-sm">Suppr.</button></div></td>
            </tr>
          ))}
        </tbody></table>
      </div></div>
    </>
  );
}

// ── Commissions ───────────────────────────────────────────────────────────────
function Commissions(){
  const[filter,setFilter]=useState("");
  const[data,setData]=useState(COMMISSIONS);
  const filtered=filter?data.filter(c=>c.statut_paiement===filter):data;
  const dues=data.filter(c=>c.statut_paiement==="en_attente").reduce((s,c)=>s+c.montant,0);
  const paye=data.filter(c=>c.statut_paiement==="paye").reduce((s,c)=>s+c.montant,0);
  const pay=id=>setData(d=>d.map(c=>c.id===id?{...c,statut_paiement:"paye",date_paiement:new Date().toISOString().slice(0,10)}:c));
  return(
    <>
      <div className="page-header">
        <div><div className="page-title">Commissions</div><div className="page-subtitle">Suivi des commissions dues aux apporteurs</div></div>
        <div className="flex items-center gap-2">
          <select className="form-control" style={{width:"auto"}} value={filter} onChange={e=>setFilter(e.target.value)}>
            <option value="">Toutes</option><option value="en_attente">En attente</option><option value="paye">Payées</option>
          </select>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:24}}>
        <div className="stat-card"><div className="stat-icon amber">💳</div><div><div className="stat-label">Commissions dues</div><div className="stat-value" style={{color:"var(--warning)"}}>{fmt(dues)}</div></div></div>
        <div className="stat-card"><div className="stat-icon green">✅</div><div><div className="stat-label">Commissions payées</div><div className="stat-value" style={{color:"var(--success)"}}>{fmt(paye)}</div></div></div>
      </div>
      <div className="card"><div className="table-wrap">
        <table><thead><tr><th>Apporteur</th><th>Prospect</th><th>Montant affaire</th><th>Commission</th><th>Statut</th><th>Calculée le</th><th>Payée le</th><th></th></tr></thead>
        <tbody>
          {filtered.map(c=>(
            <tr key={c.id}>
              <td className="fw-600">{c.apporteur_prenom} {c.apporteur_nom}</td>
              <td><div>{c.prospect_nom}</div>{c.prospect_societe&&<div className="text-muted text-sm">{c.prospect_societe}</div>}</td>
              <td>{fmt(c.montant_affaire)}</td>
              <td className="fw-600" style={{color:"var(--primary)"}}>{fmt(c.montant)}</td>
              <td><span className={`badge badge-${c.statut_paiement}`}>{c.statut_paiement==="paye"?"Payée":"En attente"}</span></td>
              <td className="text-muted">{fmtDate(c.date_calcul)}</td>
              <td className="text-muted">{fmtDate(c.date_paiement)}</td>
              <td>{c.statut_paiement==="en_attente"&&<button className="btn btn-success btn-sm" onClick={()=>pay(c.id)}>Marquer payée</button>}</td>
            </tr>
          ))}
        </tbody></table>
      </div></div>
    </>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App(){
  const[auth,setAuth]=useState(false);
  const[page,setPage]=useState("dashboard");
  if(!auth) return <Login onLogin={()=>setAuth(true)}/>;
  const PAGES={dashboard:<Dashboard/>,apporteurs:<Apporteurs/>,opportunites:<Opportunites/>,commissions:<Commissions/>};
  return(
    <div className="layout">
      <Sidebar page={page} setPage={setPage} onLogout={()=>setAuth(false)}/>
      <main className="main-content"><div className="page">{PAGES[page]}</div></main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
